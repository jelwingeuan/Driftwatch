[package]
name = "driftwatch-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "driftwatch"

[[bin]]
name = "driftwatch"
path = "src/main.rs"

[dependencies]
libc = "0.2"
plist = "1.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
